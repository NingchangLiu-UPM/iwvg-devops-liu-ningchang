name: CI

on:
  push:
    branches:
      - develop
      - staging

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Unit, Integration and Functional Tests
        run: mvn -B verify
