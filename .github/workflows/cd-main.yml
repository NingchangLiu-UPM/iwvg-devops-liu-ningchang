name: CD Main

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker image to GHCR
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Prepare image metadata
        run: |
          REPOSITORY=${GITHUB_REPOSITORY,,}
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "REPOSITORY=${REPOSITORY}" >> $GITHUB_ENV
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPOSITORY }}:latest

      # NOTE: Production AWS deployment is intentionally disabled for main
      # to save costs, matching the teacher's current cd-main.yml.
      # The block below is a commented placeholder kept for future use.
      #
      # - name: Deploy to AWS (disabled)
      #   if: false
      #   run: echo "Main AWS deployment is disabled"
