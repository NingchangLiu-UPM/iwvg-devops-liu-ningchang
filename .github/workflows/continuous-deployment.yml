name: CD

on:
  push:
    branches:
      - staging

env:
  AWS_REGION: eu-south-2
  ECR_REGISTRY: 727660953632.dkr.ecr.eu-south-2.amazonaws.com
  ECR_REPOSITORY: iwvg-devops-liu-ningchang
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: iwvg-devops
  APP_PORT: 8080

jobs:
  deploy:
    name: Build & Push to Amazon ECR & Deploy on AWS EC2
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven project (Unit, Integration, Functional tests)
        run: mvn -B verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push Docker image to Amazon ECR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          ssh-keyscan -H "${AWS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key prepared"

      - name: Deploy to EC2 via SSH
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_CONTAINER: postgres-server
          DB_NETWORK: devopsNet
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/devopsDb
        run: |
          set -eu
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_ec2"

          {
            printf 'AWS_REGION=%q\n'   "$AWS_REGION"
            printf 'ECR_REGISTRY=%q\n' "$ECR_REGISTRY"
            printf 'ECR_REPOSITORY=%q\n' "$ECR_REPOSITORY"
            printf 'CONTAINER_NAME=%q\n' "$CONTAINER_NAME"
            printf 'APP_PORT=%q\n'     "$APP_PORT"
            printf 'POSTGRES_USER=%q\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'DB_CONTAINER=%q\n' "$DB_CONTAINER"
            printf 'DB_NETWORK=%q\n'   "$DB_NETWORK"
            printf 'SPRING_DATASOURCE_URL=%q\n' "$SPRING_DATASOURCE_URL"

            cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          echo '==[1/9] ECR login via EC2 IAM role=='
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          echo '==[2/9] Capture previous running image (if any)=='
          PREV_IMAGE=$(docker inspect -f '{{.Image}}' "${CONTAINER_NAME}" 2>/dev/null || echo '')
          if [ -n "${PREV_IMAGE}" ]; then
            echo "Previous container image: ${PREV_IMAGE}"
          else
            echo 'No previous container found'
          fi

          echo '==[3/9] Ensure Docker network exists=='
          docker network inspect "${DB_NETWORK}" >/dev/null 2>&1 || docker network create "${DB_NETWORK}"

          echo '==[4/9] Verify PostgreSQL container is running=='
          if ! docker ps \
              --filter "name=${DB_CONTAINER}" \
              --filter "status=running" \
              --format '{{.Names}}' \
              | grep -qx "${DB_CONTAINER}"; then
            echo "FATAL: PostgreSQL container '${DB_CONTAINER}' is not running on network '${DB_NETWORK}'" >&2
            docker ps -a --filter "name=${DB_CONTAINER}" \
              --format 'table {{.Names}}  {{.Status}}  {{.Ports}}' >&2 || true
            exit 1
          fi
          echo "PostgreSQL container '${DB_CONTAINER}' is running"

          echo '==[5/9] Pull new image=='
          docker pull "${ECR_REGISTRY}"/"${ECR_REPOSITORY}":latest

          echo '==[6/9] Stop and remove existing container (if any)=='
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

          echo '==[7/9] Start new container=='
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --network "${DB_NETWORK}" \
            -p "${APP_PORT}":"${APP_PORT}" \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL="${SPRING_DATASOURCE_URL}" \
            -e SPRING_DATASOURCE_USERNAME="${POSTGRES_USER}" \
            -e SPRING_DATASOURCE_PASSWORD="${POSTGRES_PASSWORD}" \
            --restart unless-stopped \
            "${ECR_REGISTRY}"/"${ECR_REPOSITORY}":latest

          echo '==[8/9] Health check=='
          HEALTHY=0
          for i in $(seq 1 20); do
            sleep 3
            STATUS=$(curl -fs -o /dev/null -w '%{http_code}' http://localhost:"${APP_PORT}"/actuator/health || echo '000')
            BODY=$(curl -fs http://localhost:"${APP_PORT}"/actuator/health 2>/dev/null || echo '')
            echo "Attempt ${i}/20: HTTP=${STATUS}"
            if [ "${STATUS}" = "200" ] && echo "${BODY}" | grep -q '"status":"UP"'; then
              HEALTHY=1
              break
            fi
          done

          if [ "${HEALTHY}" -ne 1 ]; then
            echo '==[HEALTH FAILED] Diagnostic logs=='
            docker logs "${CONTAINER_NAME}" --tail=200 || true
            docker rm -f "${CONTAINER_NAME}" || true

            if [ -n "${PREV_IMAGE}" ]; then
              echo '==[ROLLBACK] Restarting previous image=='
              docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
              docker run -d \
                --name "${CONTAINER_NAME}" \
                --network "${DB_NETWORK}" \
                -p "${APP_PORT}":"${APP_PORT}" \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e SPRING_DATASOURCE_URL="${SPRING_DATASOURCE_URL}" \
                -e SPRING_DATASOURCE_USERNAME="${POSTGRES_USER}" \
                -e SPRING_DATASOURCE_PASSWORD="${POSTGRES_PASSWORD}" \
                --restart unless-stopped \
                "${PREV_IMAGE}"
            else
              echo 'No previous image to roll back to'
            fi
            exit 1
          fi
          echo 'Deployment successful: actuator/health is UP'
          REMOTE_SCRIPT
          } | ssh $SSH_OPTS "${AWS_USER}@${AWS_HOST}" 'bash -s'

      - name: Clean SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_ec2
          echo "SSH key cleaned"
